# Include this file inside the HTTPS server block for rainzt.cn.
location = /ai-comment-admin {
	return 308 /ai-comment-admin/;
}

# Keep the complete URI: the local application owns the /ai-comment-admin prefix.
location ^~ /ai-comment-admin/ {
	proxy_pass http://127.0.0.1:8371;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Connection "";
	proxy_connect_timeout 5s;
	proxy_read_timeout 30s;
	proxy_send_timeout 30s;
	client_max_body_size 64k;
}
